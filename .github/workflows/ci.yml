name: CI

# Her PR'da ve main'e her push'ta kalite kapıları.
# Yayın yapmaz — yayın deploy.yml'in işi.
on:
  pull_request:
  push:
    branches: [main]

# Yalnızca okuma. Bu workflow hiçbir şey yazmaz.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript: iki dil dosyası aynı sözleşmeye uymazsa burada patlar.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # Dış link rel'leri ve CSP denetimi (bağımlılıksız, kendi script'imiz).
      - name: Verify output
        run: pnpm verify

      # Kırık iç link kontrolü — dış adresler atlanır, CI ağ dalgalanmasına
      # bağlı kalmasın diye.
      - name: Link check
        run: pnpm linkcheck
